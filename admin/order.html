<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Order Admin Panel</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="./css/categoryAdmin.css">

    <style>
        .addrembtn {
            width: 30px;
            height: 30px;
            border: 1px solid gray;
            font-size: 20px;
            font-weight: 600;
            background-color: white;
        }

        .imageadd {
            width: 40px;
            height: 40px;
            border: 1px solid rgb(95, 92, 92);
        }
    </style>

</head>

<body>


    <div class="container-fluid">

        <div class="row min-vh-100 g-0">


            <!-- Sidebar -->

            <div class="col-lg-2 p-3">

                <div class="sidebar p-3 rounded-4 shadow">


                    <div class="logo bg-white text-center rounded-4 p-3 mb-4">
                        <h4 class="m-0"><img src="../Assests/images/logo.png" alt="" style="width: 5rem;"></h4>
                    </div>


                    <div class="nav flex-column gap-2">


                        <a href="categoryAdmin.html" class="nav-link active">
                            <i class="bi bi-grid-fill"></i>
                            Category
                        </a>


                        <a href="subcategoryAdmin.html" class="nav-link">
                            <i class="bi bi-list"></i>
                            Sub Category


                        </a>


                        <a href="ProductAdmin.html" class="nav-link">
                            <i class="bi bi-box-seam"></i>
                            Product
                        </a>


                        <a href="order.html" class="nav-link">
                            <i class="bi bi-cart"></i>
                            Orders
                        </a>


                        <a href="#" class="nav-link">
                            <i class="bi bi-person"></i>
                            Users
                        </a>


                    </div>


                </div>

            </div>





            <!-- Main Content -->

            <div class="col-lg-10 p-4">


                <div class="d-flex justify-content-between align-items-center mb-4">

                    <h3 class="title">
                        Order Management
                    </h3>


                </div>




                <!-- Form Card -->

                <div class="card border-0 rounded-4 shadow-sm mb-4">
                    <div class="card-header theme-header rounded-top-4">

                        Order List

                    </div>

                    <div class="order-container">


                        <div class="order-header">
                            <div>Sr.No</div>
                            <div>User Name</div>
                            <div>Items</div>
                            <div>Total Amount</div>
                            <div>Status</div>
                        </div>


                        <div id="orderList">


                        </div>

                    </div>


                </div>


                <style>
                    .order-header,
                    .order-row {
                        display: flex;
                        align-items: center;
                        border: 1px solid #ddd;
                    }

                    .order-header {
                        background: #FFFFFF;
                        font-weight: bold;
                    }

                    .order-header div,
                    .order-row div {
                        flex: 1;
                        padding: 12px;
                        text-align: center;
                    }

                    .order-row {
                        border-top: none;
                    }
                </style>



                <!-- Table Card -->


                <div class="card border-0 rounded-4 shadow-sm">





                </div>
            </div>
        </div>
    </div>

    sc
    <script src="js/order.js"></script>

</body>

</html>
