<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Prodcut Admin Panel</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="./css/categoryAdmin.css">

    <style>
        .addrembtn {
            width: 30px;
            height: 30px;
            border: 1px solid gray;
            font-size: 20px;
            font-weight: 600;
            background-color: white;
        }
        .imageadd{
            width: 40px;
            height: 40px;
            border: 1px solid rgb(95, 92, 92);
        }
     
    </style>

</head>

<body>


    <div class="container-fluid">

        <div class="row min-vh-100 g-0">


            <!-- Sidebar -->

            <div class="col-lg-2 p-3">

                <div class="sidebar p-3 rounded-4 shadow">


                    <div class="logo bg-white text-center rounded-4 p-3 mb-4">
                        <h4 class="m-0"><img src="../Assests/images/logo.png" alt="" style="width: 5rem;"></h4>
                    </div>


                    <div class="nav flex-column gap-2">


                        <a href="categoryAdmin.html" class="nav-link active">
                            <i class="bi bi-grid-fill"></i>
                            Category
                        </a>


                        <a href="subcategoryAdmin.html" class="nav-link">
                            <i class="bi bi-list"></i>
                            Sub Category


                        </a>


                        <a href="ProductAdmin.html" class="nav-link">
                            <i class="bi bi-box-seam"></i>
                            Product
                        </a>


                        <a href="#" class="nav-link">
                            <i class="bi bi-cart"></i>
                            Orders
                        </a>


                        <a href="#" class="nav-link">
                            <i class="bi bi-person"></i>
                            Users
                        </a>


                    </div>


                </div>

            </div>





            <!-- Main Content -->

            <div class="col-lg-10 p-4">


                <div class="d-flex justify-content-between align-items-center mb-4">

                    <h3 class="title">
                        Product Management
                    </h3>


                </div>




                <!-- Form Card -->

                <div class="card border-0 rounded-4 shadow-sm mb-4">

                    <form action="#" method="get" id="handleproductsubmit">


                        <div class="card-header theme-header rounded-top-4">

                            Add Product

                        </div>


                        <div class="card-body p-4">


                            <div class="row g-3">


                                <div class="col-md-6">

                                    <label class="form-label">
                                        Category
                                    </label><br>
                                    <select class="form-select" name="subcat" id="cat" onchange="fetchSubcategory()">
                                        <option value="">---Select Category---</option>
                                        <!-- <option value="1">Toys</option>
                                        <option value="2">Men Clothes</option>
                                        <option value="3">Women Clothes</option>
                                        <option value="4">Electronics</option>
                                        <option value="5">Mobile & Laptos</option> -->
                                    </select>
                                    <span id="catErr"></span>

                                </div>

                                <div class="col-md-6">

                                    <label class="form-label">
                                        Subcategory
                                    </label><br>
                                    <select class="form-select" name="subcat" id="subcat">
                                        <option value="">---Select Subcategory---</option>
                                        <!-- <option value="1">Train Toy</option>
                                        <option value="2">Shirt</option>
                                        <option value="3">Gown</option>
                                        <option value="4">Fan</option>
                                        <option value="5">Samsung</option> -->
                                    </select>
                                    <span id="subcatErr"></span>

                                </div>

                                <div class="col-md-6">
                                    <label for="name">Name</label>
                                    <input type="text" class="form-control" placeholder="Enter Category"
                                        id="subcatname">
                                    <span id="nameErr"></span>
                                </div>
                                <div class="col-md-6" id="allFiles">

                                    <label class="form-label">
                                        Image
                                    </label>

                                    <div>
                                        <input type="file" class="form-control" name="pimages" id="fileImage">
                                        <button onclick="handleMultipleFile()" class="addrembtn">+</button>

                                        <img src="" alt="" id="productImage" name="productImage" style="width: 50px; height: 50px;">
                                        <span id="fileErr"></span>
                                    </div>

                                    
                                </div>

                                <div class="col-md-6">

                                    <label class="form-label">
                                        Price
                                    </label>

                                    <input type="number" class="form-control" id="price">
                                    <span id="priceErr"></span>
                                </div>


                                <div class="col-12">

                                    <label class="form-label">
                                        Description
                                    </label>

                                    <textarea class="form-control" rows="4" placeholder="Enter Description"
                                        id="desc"></textarea>
                                    <span id="desErr"></span>
                                </div>

                                <!-- Checkboxes-->
                                <div class="col-12" style="display: flex;">

                                    <div style="margin-right: 20px;">
                                        <input type="checkbox" name="checkbox" value="new" id="new">
                                        <label class="form-label">
                                            New
                                        </label>
                                    </div>

                                    <div style="margin-right: 20px;">
                                        <input type="checkbox" name="checkbox" value="Best_Seller" id="Best_Seller">
                                        <label class="form-label">
                                            Best Seller
                                        </label>
                                    </div>

                                    <div style="margin-right: 20px;">
                                        <input type="checkbox" class="checkbox" value="Winter" id="Winter">
                                        <label class="form-label">
                                            Winter
                                        </label>
                                    </div>

                                    <div style="margin-right: 20px;">
                                        <input type="checkbox" class="checkbox" value="Summer" id="Summer">
                                        <label class="form-label">
                                            Summer
                                        </label>
                                    </div>

                                    <div style="margin-right: 20px;">
                                        <input type="checkbox" class="checkbox" value="Monsoon" id="Monsoon">
                                        <label class="form-label">
                                            Monsoon
                                        </label>
                                    </div>

                                </div>

                                <div class="col-12">

                                    <button type="submit" class="btn save-btn px-4">
                                        Save Product
                                    </button>

                                </div>


                            </div>


                        </div>

                    </form>
                </div>






                <!-- Table Card -->


                <div class="card border-0 rounded-4 shadow-sm">


                    <div class="card-header theme-header rounded-top-4">

                        Product List

                    </div>


                    <div class="card-body p-4">


                        <div class="table-responsive">


                            <table class="table table-hover align-middle" id="displaydata">


                                <thead>

                                    <tr>

                                        <th>Sr.no</th>
                                        <th>Category</th>
                                        <th>Subcategory</th>
                                        <th>ProductName</th>
                                        <th>Price</th>
                                        <th>Image</th>
                                        <th>Description</th>
                                        <th>Checkboxes</th>
                                        <th>Action</th>

                                    </tr>

                                </thead>


                                <tbody id="displayProductTable">


                                    <!-- <tr>

                                        <td>1</td>

                                        <td>
                                            <img src="https://via.placeholder.com/60">
                                        </td>
                                        <td>
                                            category
                                        </td>
                                        <td>
                                            Subcategory
                                        </td>
                                        <td>
                                            Fan
                                        </td>
                                        <td>Price</td>
                                        <td>
                                            Electronic Products
                                        </td>


                                        <td>

                                            <button class="btn btn-warning btn-sm">
                                                <i class="bi bi-pencil"></i>
                                            </button>


                                            <button class="btn btn-danger btn-sm">
                                                <i class="bi bi-trash"></i>
                                            </button>

                                        </td>
                                    </tr> -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    sc
    <script src="js/ProductAdmin.js"></script>

</body>

</html>
