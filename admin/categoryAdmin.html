<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Category</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="./css/categoryAdmin.css">

</head>

<body>


    <div class="container-fluid">

        <div class="row min-vh-100 g-0">


            <!-- Sidebar -->

            <div class="col-lg-2 p-3">

                <div class="sidebar p-3 rounded-4 shadow">


                    <div class="logo bg-white text-center rounded-4 p-3 mb-4">
                        <h4 class="m-0"><img src="../Assests/images/logo.png" alt="" style="width: 5rem;"></h4>
                    </div>


                    <div class="nav flex-column gap-2">


                        <a href="categoryAdmin.html" class="nav-link active">
                            <i class="bi bi-grid-fill"></i>
                            Category
                        </a>


                        <a href="subcategoryAdmin.html" class="nav-link">
                            <i class="bi bi-list"></i>
                            Sub Category
                        </a>


                        <a href="ProductAdmin.html" class="nav-link">
                            <i class="bi bi-box-seam"></i>
                            Product
                        </a>


                        <a href="order.html" class="nav-link">
                            <i class="bi bi-cart"></i>
                            Orders
                        </a>


                        <a href="#" class="nav-link">
                            <i class="bi bi-person"></i>
                            Users
                        </a>


                    </div>


                </div>

            </div>





            <!-- Main Content -->

            <div class="col-lg-10 p-4">


                <div class="d-flex justify-content-between align-items-center mb-4">

                    <h3 class="title">
                        Category Management
                    </h3>


                </div>




                <!-- Form Card -->

                <div class="card border-0 rounded-4 shadow-sm mb-4">

                    <form action="#" method="get"  id="catefory_form">


                        <div class="card-header theme-header rounded-top-4">

                            Add Category

                        </div>


                        <div class="card-body p-4">


                            <div class="row g-3">


                                <div class="col-md-6">

                                    <label class="form-label">
                                        Category Name
                                    </label>

                                    <input type="text" class="form-control" placeholder="Enter Category" id="catname" name="catname">
                                    <span id="nameErr"></span>
                                </div>


                                <div class="col-md-6">

                                    <label class="form-label">
                                        Image
                                    </label>

                                    <img src="" alt="" id="displayImg" style="width: 70px; height: 70px;">


                                    <input type="file" class="form-control" id="file1">
                                    <span id="fileErr"></span>
                                </div>

                                <div class="col-12">

                                    <label class="form-label">
                                        Description
                                    </label>

                                    <textarea class="form-control" rows="4" placeholder="Enter Description" id="desc"></textarea>
                                    <span id="desErr"></span>
                                </div>


                                <div class="col-12">

                                    <button type="submit" class="btn save-btn px-4">
                                        Save Category
                                    </button>

                                </div>


                            </div>


                        </div>

                    </form>
                </div>






                <!-- Table Card -->


                 <div class="card border-0 rounded-4 shadow-sm">


                    <div class="card-header theme-header rounded-top-4">

                        Category List

                    </div>


                    <div class="card-body p-4">


                        <div class="table-responsive">


                            <table class="table table-hover align-middle">


                                <thead>

                                    <tr>

                                        <th>Sr.no</th>
                                        <th>Category</th>
                                        <th>File</th>
                                        <th>Description</th>
                                        <th>Action</th>

                                    </tr>

                                </thead>


                                <tbody id="dispcat">


                                    <!-- <tr>

                                        <td>1</td>

                                        <td>
                                            <img src="https://via.placeholder.com/60">
                                        </td>

                                        <td>
                                            Electronics
                                        </td>

                                        <td>
                                            Electronic Products
                                        </td>


                                        <td>

                                            <button class="btn btn-warning btn-sm">
                                                <i class="bi bi-pencil"></i>
                                            </button>


                                            <button class="btn btn-danger btn-sm">
                                                <i class="bi bi-trash"></i>
                                            </button>

                                        </td>
                                    </tr> -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div> 
            </div>
        </div>
    </div>

    <script src="./js/categoryAdmin.js"></script>
    <script src="./js/addcatinsubcat.js"></script>
</body>

</html>
